name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Los tokens se regeneran antes de cada comando (scripts pre*), pero
      # typecheck y test dependen de ellos: si fallan, el error es de tokens.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
