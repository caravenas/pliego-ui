name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    # peerDependencies admite React 18 y 19: cada versión se comprueba entera, y un
    # fallo en una no cancela la otra para ver las dos a la vez.
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Con --no-save, package.json y el lockfile no cambian: la matriz solo toca lo
      # que hay en node_modules, no lo que se publica.
      - name: Instalar React ${{ matrix.react }}
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}

      # Una celda 19 que corriera en 18 pasaría en verde sin comprobar nada.
      - name: Comprobar la versión de React instalada
        run: |
          node -e "
            for (const name of ['react', 'react-dom']) {
              const { version } = require(name + '/package.json');
              console.log(name, version);
              if (!version.startsWith('${{ matrix.react }}.')) {
                console.error(name + ' ' + version + ' no es de la celda ${{ matrix.react }}');
                process.exit(1);
              }
            }
          "

      # Los tokens se regeneran antes de cada comando (scripts pre*), pero
      # typecheck y test dependen de ellos: si fallan, el error es de tokens.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

      # axe y áreas de puntero (40 px, 44 px con puntero grueso) sobre cada story del
      # Storybook ya compilado; una violación falla.
      # Las capturas (test:visual) no se ejecutan aquí: sus referencias son de
      # macOS y una captura de otro sistema no es comparable (ver PLAN.md).
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/a11y.spec.ts e2e/touch-targets.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-react-${{ matrix.react }}
          path: playwright-report
          retention-days: 7
