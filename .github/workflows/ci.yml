name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Los tokens se regeneran antes de cada comando (scripts pre*), pero
      # typecheck y test dependen de ellos: si fallan, el error es de tokens.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

      # axe sobre cada story del Storybook ya compilado; una violación falla.
      # Las capturas (test:visual) no se ejecutan aquí: sus referencias son de
      # macOS y una captura de otro sistema no es comparable (ver PLAN.md).
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/a11y.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
