name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Escribe el .npmrc del registro de GitHub Packages con el token.
          registry-url: https://npm.pkg.github.com
          scope: '@caravenas'

      - run: npm ci

      # Con changesets pendientes abre (o actualiza) el PR de versión. Al
      # mergearlo no quedan changesets, y entonces `publish` corre `npm run
      # release`, que construye y publica. Mientras no haya changesets ni PR de
      # versión mergeado, no publica nada.
      - uses: changesets/action@v1
        with:
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
