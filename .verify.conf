# Verification contract, created by ~/.agents/workflows/scripts/verify.sh the
# first time an agent worked in this repository. It declares no checks yet.
# Chris edits it by hand: .agents/policy.json protects it from agents.
#
# fast runs after every edit and should stay cheap; full runs when an agent
# stops and before each commit. One "name: command" per line, for example:
#
#   [full]
#   test: npm test --silent

[fast]
typecheck: npm run typecheck --silent

[full]
typecheck: npm run typecheck --silent
test: npm test --silent
build: npm run build --silent
storybook: npm run build-storybook --silent
checkpoint: checkpoint check --current --strict
